<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Maven Dependency Graph{% endblock %}</title>
<style>
  :root { --bg:#0f1117; --panel:#171a23; --border:#2a2f3a; --text:#e6e8ee;
          --muted:#8b93a7; --accent:#6ea8fe; --ok:#5fd193; --err:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:1.5rem; padding:.9rem 1.5rem;
           border-bottom:1px solid var(--border); background:var(--panel); }
  header .brand { font-weight:600; font-size:1.05rem; }
  nav a { color:var(--muted); text-decoration:none; margin-right:1.2rem; font-size:.92rem; }
  nav a:hover, nav a.active { color:var(--accent); }
  .root-line { color:var(--muted); font-size:.8rem; margin-left:auto; }
  main { padding:1.5rem; max-width:1400px; margin:0 auto; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:8px;
          padding:1rem 1.25rem; margin-bottom:1rem; }
  .muted { color:var(--muted); }
  .ok { color:var(--ok); } .err { color:var(--err); }
  .toolbar { display:flex; gap:.6rem; margin-bottom:1rem; flex-wrap:wrap; align-items:center; }
  .toolbar input[type=text] { flex:1; min-width:240px; padding:.5rem .7rem; border-radius:6px;
      background:#0b0d12; border:1px solid var(--border); color:var(--text); }
  .btn { padding:.45rem .9rem; border-radius:6px; border:1px solid var(--border);
         background:#21252f; color:var(--text); cursor:pointer; font-size:.85rem; }
  .btn:hover { border-color:var(--accent); }
  .module-card { margin-bottom:1.2rem; }
  .module-head { display:flex; align-items:center; gap:.6rem; cursor:pointer;
                padding:.6rem .8rem; background:#1c2030; border-radius:6px; }
  .module-head:hover { background:#22273a; }
  .module-title { font-weight:600; }
  .caret { width:1rem; display:inline-block; color:var(--muted); }
  .version-pill { font-size:.72rem; background:#2c3142; padding:.1rem .45rem; border-radius:10px;
                  color:var(--muted); margin-left:.4rem; }
  .scope-pill { font-size:.7rem; background:#3a2f1d; color:#e0b070; padding:.1rem .4rem;
                border-radius:10px; margin-left:.3rem; }
  /* tree nodes */
  ul.tree { list-style:none; padding-left:1.1rem; margin:.3rem 0; }
  ul.tree.root { padding-left:0; }
  li.node { position:relative; padding:.18rem 0; }
  li.node > .row { display:flex; align-items:center; gap:.45rem; cursor:pointer; padding:.18rem .2rem; border-radius:4px; }
  li.node > .row:hover { background:#1c2030; }
  li.node > .row .name { font-size:.9rem; }
  .node.hidden { display:none; }
  .node.dim > .row { opacity:.32; }
  .node.match > .row .name { color:var(--accent); font-weight:600; }
  .conflict-row { display:flex; justify-content:space-between; gap:1rem; padding:.5rem 0;
                  border-bottom:1px solid var(--border); }
  .conflict-key { font-weight:600; }
  .ver-badge { font-size:.78rem; background:#3a2330; color:#ff9cb3; padding:.12rem .5rem;
               border-radius:8px; margin-right:.4rem; }
  .err-box { background:#2a1818; border:1px solid #5a2a2a; color:#ff9b9b; padding:.6rem .8rem;
             border-radius:6px; font-size:.8rem; margin-top:.5rem; }
  .small { font-size:.78rem; color:var(--muted); }
  pre.export { white-space:pre; overflow-x:auto; background:#0b0d12; border:1px solid var(--border);
              padding:1rem; border-radius:8px; font-size:.8rem; }
  /* folder picker in header */
  #load-form { display:flex; gap:.4rem; align-items:center; margin-left:auto; }
  #load-form input[type=text] { width:240px; padding:.4rem .6rem; border-radius:6px;
      background:#0b0d12; border:1px solid var(--border); color:var(--text); font-size:.8rem; }
  #load-form input[type=text]::placeholder { color:var(--muted); }
  #load-form button { padding:.4rem .8rem; }
  #load-status { font-size:.75rem; margin-left:.5rem; }
  #load-status.ok { color:var(--ok); } #load-status.err { color:var(--err); }
</style>
{% block extra_head %}{% endblock %}
</head>
<body>
<header>
  <span class="brand">📦 Maven Dependency Graph</span>
  <nav>
    <a href="/tree">1 · Dependency Tree</a>
    <a href="/conflicts">2 · Conflicts</a>
    <a href="/export">3 · Neo4j Export</a>
  </nav>
  <form id="load-form">
    <input type="text" id="folder-path" placeholder="/path/to/java/projects"
           value="{{ root }}" autocomplete="off" spellcheck="false">
    <button type="submit" class="btn">Load folder</button>
    <span id="load-status"></span>
  </form>
</header>
<main>
{% block content %}{% endblock %}
</main>
<script>
// Folder picker — POST to /api/load, then reload the page.
(function() {
  const form = document.getElementById('load-form');
  const input = document.getElementById('folder-path');
  const status = document.getElementById('load-status');
  if (!form) return;
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const root = (input.value || '').trim();
    if (!root) { status.textContent = 'enter a folder path'; status.className='err'; return; }
    status.textContent = 'loading…'; status.className = '';
    try {
      const body = new URLSearchParams({ root });
      const r = await fetch('/api/load', { method: 'POST', body });
      const data = await r.json();
      if (data.ok) {
        status.textContent = `✓ ${data.modules} module${data.modules===1?'':'s'} loaded`;
        status.className = 'ok';
        setTimeout(() => location.reload(), 400);
      } else {
        status.textContent = '✗ ' + (data.error || 'failed');
        status.className = 'err';
      }
    } catch (err) {
      status.textContent = '✗ ' + err;
      status.className = 'err';
    }
  });
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
