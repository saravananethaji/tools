        function analyzeFeature() {
            const featureContent = document.getElementById('feature-content').textContent;
            if (!featureContent.trim()) {
                alert('Please load a feature file first');
                return;
            }

            const analysis = analyzeFeatureFile(featureContent);
            displayAnalysis(analysis);

        function analyzeFeatureFile(content) {
            const lines = content.split('\n').map(line => line.trim());
            
            const analysis = {
                feature: {
                    name: '',
                    description: []
                },
                background: {
                    steps: []
                },
                scenarios: [],
                apiCalls: [],
                dataValidations: [],
                artifacts: new Set(),
                dependencies: []
            };

            let currentSection = null;
            let currentScenario = null;

            lines.forEach((line, index) => {
                // Feature declaration
                if (line.startsWith('Feature:')) {
                    analysis.feature.name = line.substring(8).trim();
                    currentSection = 'feature';
                    return;
                }

                // Feature description
                if (currentSection === 'feature' && line && !line.startsWith('#') && 
                    !line.startsWith('Background:') && !line.startsWith('Scenario:')) {
                    if (line) analysis.feature.description.push(line);
                    return;
                }

                // Background
                if (line.startsWith('Background:')) {
                    currentSection = 'background';
                    return;
                }

                // Scenario
                if (line.startsWith('Scenario:')) {
                    const scenarioName = line.substring(9).trim();
                    currentScenario = {
                        name: scenarioName,
                        steps: [],
                        lineNumber: index + 1
                    };
                    analysis.scenarios.push(currentScenario);
                    currentSection = 'scenario';
                    return;
                }

                // Steps
                if (currentSection && 
                    (line.startsWith('Given ') || line.startsWith('When ') || 
                     line.startsWith('Then ') || line.startsWith('And ') || 
                     line.startsWith('But '))) {
                    
                    const step = {
                        keyword: line.split(' ')[0],
                        text: line.substring(line.indexOf(' ') + 1),
                        lineNumber: index + 1
                    };

                    if (currentSection === 'background') {
                        analysis.background.steps.push(step);
                    } else if (currentScenario) {
                        currentScenario.steps.push(step);
                        extractStepSemantics(step, analysis);
                    }
                    return;
                }

                // Dependency comments
                if (line.startsWith('#') && line.includes('requires')) {
                    analysis.dependencies.push({
                        type: 'explicit',
                        text: line.trim(),
                        lineNumber: index + 1
                    });
                }
            });

            analysis.artifacts = Array.from(analysis.artifacts);
            return analysis;
        }

        function extractStepSemantics(step, analysis) {
            const text = step.text.toLowerCase();
            
            // Detect API calls
            if (text.includes('post') || text.includes('get') || 
                text.includes('put') || text.includes('delete') ||
                text.includes('request') || text.includes('sent to')) {
                
                const uriMatch = step.text.match(/["']([^"']*system\/[^"']*)["']/) ||
                                step.text.match(/["']([^"']*\/\w+[^"']*)["']/);
                
                if (uriMatch) {
                    analysis.apiCalls.push({
                        method: extractHttpMethod(step.text),
                        uri: uriMatch[1],
                        stepLine: step.lineNumber,
                        rawText: step.text
                    });
                }
            }

            // Detect UUID headers
            if (text.includes('uuid') && text.includes('header')) {
                const uuidMatch = step.text.match(/["']([a-f0-9\-]+)["']/i);
                if (uuidMatch) {
                    analysis.artifacts.add(`UUID: ${uuidMatch[1]}`);
                }
            }

            // Detect request body files
            if (text.includes('request body') && text.includes('contents of')) {
                const fileMatch = step.text.match(/["']([^"']*\.(json|xml|txt))["']/);
                if (fileMatch) {
                    analysis.artifacts.add(`Request Body: ${fileMatch[1]}`);
                }
            }

            // Detect response logging
            if (text.includes('log') && text.includes('response')) {
                analysis.artifacts.add('Response Logging');
            }

            // Detect database validations
            if (text.includes('validate') && text.includes('db table')) {
                analysis.dataValidations.push({
                    type: 'database',
                    stepLine: step.lineNumber,
                    rawText: step.text
                });
            }

            // Detect specific table validations
            if (text.includes('adapter_context') || text.includes('ms_inbox_events')) {
                const tableName = text.includes('adapter_context') ? 'adapter_context' : 'ms_inbox_events';
                analysis.artifacts.add(`Database Table: ${tableName}`);
            }

            // Detect file references
            if (text.includes('src/test/resources') || text.includes('.json')) {
                const fileMatches = step.text.match(/["']([^"']*\.(json|xml|yml|yaml))["']/g) || [];
                fileMatches.forEach(match => {
                    const cleanMatch = match.replace(/["']/g, '');
                    analysis.artifacts.add(`File: ${cleanMatch}`);
                });
            }
        }

        function extractHttpMethod(text) {
            const upperText = text.toUpperCase();
            if (upperText.includes('POST')) return 'POST';
            if (upperText.includes('GET')) return 'GET';
            if (upperText.includes('PUT')) return 'PUT';
            if (upperText.includes('DELETE')) return 'DELETE';
            if (upperText.includes('PATCH')) return 'PATCH';
            return 'UNKNOWN';
        }

        function displayAnalysis(analysis) {
            let html = `<h2>Analysis Results for: "${analysis.feature.name}"</h2>`;
            
            if (analysis.feature.description.length > 0) {
                html += `<p><strong>Description:</strong> ${analysis.feature.description.join(' ')}</p>`;
            }
            
            html += `<div class="section"><h3>Background (${analysis.background.steps.length} steps)</h3><ul>`;
            analysis.background.steps.forEach(step => {
                html += `<li><strong>${step.keyword}:</strong> ${step.text}</li>`;
            });
            html += `</ul></div>`;
            
            html += `<div class="section"><h3>Scenarios (${analysis.scenarios.length})</h3>`;
            analysis.scenarios.forEach((scenario, idx) => {
                html += `<div style="border: 1px solid #ddd; margin: 10px 0; padding: 15px; border-radius: 5px;">`;
                html += `<h4>Scenario ${idx + 1}: ${scenario.name}</h4>`;
                html += `<p><small>Line ${scenario.lineNumber}</small></p>`;
                html += `<ul>`;
                scenario.steps.forEach(step => {
                    html += `<li><strong>${step.keyword}:</strong> ${step.text}</li>`;
                });
                html += `</ul></div>`;
            });
            html += `</div>`;
            
            if (analysis.apiCalls.length > 0) {
                html += `<div class="section"><h3>API Calls Detected (${analysis.apiCalls.length})</h3><ul>`;
                analysis.apiCalls.forEach(call => {
                    html += `<li><strong>${call.method}:</strong> ${call.uri}<br>`;
                    html += `<small>Line ${call.stepLine}: "${call.rawText}"</small></li>`;
                });
                html += `</ul></div>`;
            }
            
            if (analysis.artifacts.size > 0) {
                html += `<div class="section"><h3>Artifacts & References Detected</h3><ul>`;
                analysis.artifacts.forEach(artifact => {
                    html += `<li>${artifact}</li>`;
                });
                html += `</ul></div>`;
            }
            
            if (analysis.dataValidations.length > 0) {
                html += `<div class="section"><h3>Data Validations Detected (${analysis.dataValidations.length})</h3><ul>`;
                analysis.dataValidations.forEach(val => {
                    html += `<li><strong>Validation:</strong> ${val.rawText}<br>`;
                    html += `<small>Line ${val.stepLine}</small></li>`;
                });
                html += `</ul></div>`;
            }
            
            if (analysis.dependencies.length > 0) {
                html += `<div class="section"><h3>Dependencies & Notes</h3><ul>`;
                analysis.dependencies.forEach(dep => {
                    html += `<li>${dep.text}</li>`;
                });
                html += `</ul></div>`;
            }
            
            // Generate human-readable explanation
            html += `<div class="section"><h3>Human-Readable Explanation</h3>`;
            html += `<button class="btn" onclick="generateExplanation()">Generate Explanation</button>`;
            html += `<pre id="explanation-output" style="background: #f8f9fa; padding: 15px; border-radius: 4px; overflow-x: auto;"></pre></div>`;
            
            document.getElementById('analysis-results').innerHTML = html;
            document.getElementById('analysis-results').style.display = 'block';
        }
